events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Optimizaciones básicas
    sendfile        on;
    keepalive_timeout  65;

    # 1. Frontend Público (Tienda)
    server {
        listen 80;
        server_name tiendawebav.nickval.dev;

        location / {
            proxy_pass http://frontend-web:3000; # Nombre del servicio en docker-compose
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 2. Frontend de Administración
    server {
        listen 80;
        server_name adminwebav.nickval.dev;

        location / {
            proxy_pass http://frontend-admin:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 3. API Gateway y BFFs
    server {
        listen 80;
        server_name apiwebav.nickval.dev; # Subdominio para las APIs

        # Enruta las peticiones de la tienda al BFF Web
        location /web/ {
            proxy_pass http://bff-web:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Enruta las peticiones del admin al BFF Admin
        location /admin/ {
            proxy_pass http://bff-admin:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # 4. Monitoreo (Grafana)
    server {
        listen 80;
        server_name grafanawebav.nickval.dev;

        location / {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Soporte para WebSockets en Grafana
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}