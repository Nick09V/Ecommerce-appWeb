version: "3.8"

services:
  # 1. Túnel Seguro
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    restart: unless-stopped
    networks:
      - app-network

  # 2. Proxy Inverso / API Gateway
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend-web
      - frontend-admin
      - bff-web
      - bff-admin
    restart: unless-stopped
    networks:
      - app-network

  # 3. Interfaces de Usuario (Frontends)
  frontend-web:
    build: ./frontend/web
    restart: unless-stopped
    networks:
      - app-network

  frontend-admin:
    build: ./frontend/admin
    restart: unless-stopped
    networks:
      - app-network

# 4. Orquestadores (BFFs)
  bff-web:
    build: ./bff/web
    ports:
      - "3000:3000"   # Mapea el 3000 interno al 3000 local
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - INVENTORY_SERVICE_URL=http://inventory-service:3002
      - CHAT_SERVICE_URL=http://chat-service:3003
    networks:
      - app-network

  bff-admin:
    build: ./bff/admin
    ports:
      - "3005:3000"   # Mapea el 3000 interno al 3004 local
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - INVENTORY_SERVICE_URL=http://inventory-service:3002
      - CHAT_SERVICE_URL=http://chat-service:3003
    networks:
      - app-network

  # 5. Microservicios Core
  auth-service:
    build: ./services/auth
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=${AUTH_DB_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3001
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  inventory-service:
    build: ./services/inventory
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=${INVENTORY_DB_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3002
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  chat-service:
    build: ./services/chat
    ports:
      - "3003:3003"
    environment:
      - DATABASE_URL=${CHAT_DB_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3003
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  # 6. Caché y Mensajería de Eventos
  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # 7. Monitoreo (SRE)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml # Ruta al archivo que crearemos
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - app-network 

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3004:3000" # Expuesto en el 3004 para que no choque con tus BFFs
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - app-network

  # 8. Base de Datos Local
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: root_admin
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Mapeo del script init.sql para aislar los esquemas automáticamente
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
