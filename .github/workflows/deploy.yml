name: Despliegue a Produccion en VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Conectar por SSH y Desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # 1. Navegar a la carpeta del proyecto en la VM
            # (Asegúrate de cambiar "ruta_del_proyecto" por la ruta real en tu VM)
            cd /home/${{ secrets.VM_USERNAME }}/ecommerce-appweb

            # 2. Descargar los últimos cambios del repositorio
            git pull origin main

            # 3. Detener contenedores actuales, reconstruir imágenes y levantar todo
            docker-compose down
            docker-compose up -d --build

            # 4. Limpiar imágenes huérfanas para no llenar el disco de la VM
            docker image prune -f
